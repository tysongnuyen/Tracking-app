<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kết nối Tracking App</title><link rel="stylesheet" href="options.css"></head>
<body><main><div class="mark">◷</div><h1>Tracking App</h1><p>Kết nối tab trình duyệt với app trên máy.</p><label for="client">Trình duyệt này</label><select id="client"><option value="chrome">Google Chrome</option><option value="msedge">Microsoft Edge</option><option value="brave">Brave</option></select><label for="token">Mã kết nối</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Dán mã từ Cài đặt của app"><button id="connect">Lưu &amp; kết nối</button><p id="status" role="status"></p><small>Mở TrackingApp-Python.exe → Cài đặt → Tab nền đầy đủ → Sao chép mã kết nối. Chỉ cài trong một profile của mỗi trình duyệt. Tab ẩn danh được bỏ qua.</small></main><script src="options.js"></script></body></html>
